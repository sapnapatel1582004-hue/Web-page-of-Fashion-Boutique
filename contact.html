 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Us</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>

/* PAGE BACKGROUND */
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#183328,#1f3b2c);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* CONTACT BOX */
.contact-box{
  background:rgba(255,255,255,0.08);
  padding:40px;
  border-radius:12px;
  width:320px;
  text-align:center;
  backdrop-filter:blur(10px);
}

/* HEADING */
.contact-box h1{
  margin-bottom:20px;
  color:#f2b77c;
}

/* TEXT */
.contact-box p{
  margin:10px 0;
  font-size:14px;
}

/* BUTTON */
.back-btn{
  display:inline-block;
  margin-top:20px;
  padding:10px 20px;
  background:#f2b77c;
  color:#1f3b2c;
  text-decoration:none;
  border-radius:25px;
  font-weight:500;
}

.back-btn:hover{
  background:#e0a866;
}

</style>
</head>

<body>

<div class="contact-box">

  <h1>Contact Us</h1>

  <p>📍 Mumbai, Maharashtra</p>
  <p>📞 +91 87790 26016</p>
  <p>📧 sapnafashionboutique@gmail.com</p>
  <p>🕒 Mon – Sat : 10 AM – 8 PM</p>

  <a href="index.html" class="back-btn">Back to Home</a>

</div>

</body>
</html>
